<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="PetCare Pro - Premium Veterinary Clinic Management System Dashboard & PWA" />
    
    <!-- PWA Settings -->
    <meta name="theme-color" content="#0d9488" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PetCare Pro" />
    <link rel="apple-touch-icon" href="/kt-logo.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>PetCare Pro — Clinic Management System (PWA)</title>

    <!-- 1. HIDE GOOGLE BRANDING & POPUPS -->
    <style>
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-te-gadget-icon,
      .goog-logo-link,
      .goog-te-spinner-pos,
      .goog-te-spinner,
      .goog-te-spinner *,
      .goog-te-gadget img,
      .goog-te-menu-value img,
      iframe.skiptranslate {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      body { top: 0px !important; }
      .goog-te-gadget { color: transparent !important; font-size: 0 !important; }
      .goog-te-gadget span { display: none !important; }
      .VIpgJd-ZVi9od-ORHb-OEVmcd { display: none !important; }
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf { display: none !important; }
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc { display: none !important; }
      #goog-gt-voting { display: none !important; }
    </style>

    <!-- 2. INITIALIZE TRANSLATE LOGIC (5 Languages: en, hi, gu, mr, fr) -->
    <script type="text/javascript">
      window.googleTranslateElementInit = function () {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,hi,gu,mr,fr',
          autoDisplay: false
        }, 'google_translate_master_container');
      };
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body>
    <div id="root"></div>

    <!-- 3. INVISIBLE GOOGLE CONTAINER -->
    <div id="google_translate_master_container" style="display:none !important"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
